<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      /* 태그 선택자 -해당 페이지에 모든 p 태그 선택됨 */
      p {
        /*  */
        color: red;
      }
      /* 2. id 선택자 */
      #temp01 {
        color: aqua;
        font-weight: bold;
      }
      /* 3. 클래스 선택자 */
      .temp02 {
        color: blueviolet;
        font-size: 20px;
      }
    </style>
  </head>
  <body>
    <h2>CSS 선택자란</h2>
    <p>여기는 첫번째 p태그야</p>
    <p id="temp01">여기는 두번쨰 p태그야</p>
    <p class="temp02">여기는 세번쨰 p태그야</p>
    <p class="temp02">여기는 네번쨰 p태그야</p>
  </body>
</html>
