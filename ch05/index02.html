<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- srt 속성 -->
    <img
      src="https://picsum.photos/id/870/200/200?grayscale&blur=2"
      alt="샘플이미지"
    />
    <p>
      <a href="https://www.google.com" target="_blank"> 내 포트폴리오 가기
    </p>
    
    <!-- placeholder 속성, maxlength 속성 -->
    <input type="text" placeholder="한줄 소개를 입력하세요" maxlength="10" />

    <!-- disabled 속성 : 비활성화 -->
    <button disabled>아직 준비중</button>
  </body>
</html>
